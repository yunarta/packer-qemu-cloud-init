name: build

on: [push]


jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

#      - name: List
#        run: |
#          ls -ltR

      - name: Build
        working-directory: src/01-build
        run: |
          mkdir -p log
          mkisofs -output cloud-init.iso -volid cidata -joliet -rational-rock cloud-init/meta-data cloud-init/user-data
          PACKER_LOG=0 packer build -force packer.pkr.hcl 

      - uses: actions/upload-artifact@v3
        with:
          name: build
          path: src/01-build/output-redhat/*
